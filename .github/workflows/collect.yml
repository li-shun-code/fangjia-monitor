# 每日采集：房天下+链家 → snapshot/history，提交回仓库（提交即触发 Vercel 重新部署）
name: collect
on:
  schedule:
    - cron: "0 21 * * *" # UTC 21:00 = 北京时间次日 05:00
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect
      - name: 提交新数据
        run: |
          git config user.name "fangjia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/snapshot.json data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "采集快照 $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
